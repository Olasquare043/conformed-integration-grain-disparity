[project]
name = "cigd"
version = "0.1.0"
description = "Conformed dimensional integration at extreme grain disparity: integration cost and downstream model effect across two New York domains."
readme = "README.md"
license = "MIT"
authors = [{ name = "Olasquare" }]
requires-python = "==3.12.*"
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "requests",
    "pyyaml",
    "python-dotenv",
    "rich",
    "psutil",
    "scikit-learn",
    "lightgbm",
    "statsmodels",
    "matplotlib",
    "papermill",
    "nbconvert",
    "ipykernel",
    "pytest",
    "pyshp>=3.1.6",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pre-commit",
    "nbstripout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cigd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
