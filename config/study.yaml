# Study configuration. Every window, cutoff, seed, path and source URL used by
# the pipeline is set here, so a reviewer can see the whole study design in one file.

study:
  title: >-
    Conformed Dimensional Integration at Extreme Grain Disparity:
    Integration Cost and Downstream Model Effect across Two Domains
  # Fine-grain domain window, inclusive, as YYYY-MM.
  trip_first_month: "2024-01"
  trip_last_month: "2025-12"
  # Earlier months are streamed only to build zone-day trip counts for the
  # coarse-grain trip-demand features; each raw file is deleted after aggregation.
  trip_history_first_month: "2017-01"
  trip_history_last_month: "2023-12"
  # Coarse-grain panel starts with the NYSERDA series (January 2017).
  price_first_week: "2017-01-02"
  # No observation dated after this day is used anywhere in the analysis.
  # NY Open Data keeps publishing new weeks, so this freezes the snapshot.
  data_cutoff_date: "2025-12-31"
  random_seed: 20240101
  include_high_volume_fhv: false
  # The original EIA level tolerance was calibrated for the full window; see docs/decisions.md.
  enforce_eia_level_tolerance: true

# Profiles override the study block. "full" is the paper run; "smoke" is a
# few-minute reviewer check on one month of trips and a short price slice.
profiles:
  full: {}
  smoke:
    trip_first_month: "2024-01"
    trip_last_month: "2024-01"
    trip_history_first_month: "2023-12"
    trip_history_last_month: "2023-12"
    price_first_week: "2023-01-02"
    data_cutoff_date: "2024-03-31"
    # Fifteen months are too short to estimate the level bias; computed and recorded only.
    enforce_eia_level_tolerance: false

paths:
  # Raw downloads go to <data_root>/raw and derived data to <data_root>/<profile>,
  # so a smoke run never overwrites the paper outputs. Set the environment
  # variable CIGD_DATA_DIR to keep the data on another drive.
  data_root: data
  results_dir: results
  smoke_results_dir: results/smoke
  logs_dir: logs
  manifest: provenance/manifest.csv

sources:
  yellow_taxi:
    url_template: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{month}.parquet
  high_volume_fhv:
    url_template: https://d37ci6vzurychx.cloudfront.net/trip-data/fhvhv_tripdata_{month}.parquet
  taxi_zone_lookup:
    url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
  nyserda_gasoline:
    dataset_id: nqur-w4p7
    export_url: https://data.ny.gov/api/views/nqur-w4p7/rows.csv?accessType=DOWNLOAD
  eia_gasoline:
    api_url: https://api.eia.gov/v2/petroleum/pri/gnd/data/
    # Weekly regular gasoline, all formulations, retail, dollars per gallon.
    series:
      EMM_EPMR_PTE_SNY_DPG: New York State
      EMM_EPMR_PTE_R1Y_DPG: PADD 1B
  open_meteo:
    api_url: https://archive-api.open-meteo.com/v1/archive
    timezone: America/New_York
    # Pinned reanalysis model. The default "best_match" can switch models upstream,
    # which would silently change the weather series between runs.
    model: era5
    daily_variables:
      - temperature_2m_max
      - temperature_2m_min
      - temperature_2m_mean
      - precipitation_sum
      - snowfall_sum
      - wind_speed_10m_max

# Data quality thresholds, fixed before the data were profiled.
quality:
  eia_crosscheck:
    # The NYSERDA state average must track EIA's New York State series.
    max_median_absolute_difference_usd: 0.10
    min_correlation: 0.98
  # Added 2026-10-09 after the Phase 2 profile (see docs/decisions.md): agreement
  # of weekly changes at the observed alignment (NYSERDA week w against EIA week
  # w - 1), with the level bias bounded separately. Enforced in every profile.
  eia_change_check:
    alignment_offset_weeks: -1
    min_change_correlation: 0.75
    max_absolute_mean_level_bias_usd: 0.15
  price_outliers:
    # A regional weekly price is flagged (not removed) when it moves more than
    # this in one week, or falls outside the plausible range.
    max_weekly_change_usd: 0.30
    plausible_min_usd: 1.00
    plausible_max_usd: 7.00
  # Rules that remove a trip from fact_trip; each is reported separately.
  # See sql/warehouse/stg_trip_validity.sql and docs/data_dictionary.md.
  trip_validity:
    excluded_vendor_ids: [7]
    min_duration_seconds: 60
    max_duration_seconds: 10800
    max_distance_miles: 100
    max_average_speed_mph: 80
