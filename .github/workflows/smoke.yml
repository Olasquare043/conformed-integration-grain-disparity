# Lint, then run the whole pipeline on the smoke sample. The smoke run ends
# with the test stage, so every push also runs the full test suite.
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.8"

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen pre-commit run --all-files

      - name: Smoke run
        run: make smoke QUIET=1
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Keep the logs and smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-run
          path: |
            logs/
            results/smoke/
          if-no-files-found: ignore
