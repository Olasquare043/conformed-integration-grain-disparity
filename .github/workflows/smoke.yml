# Lint, then run the whole pipeline on the smoke sample. The smoke run ends
# with the test stage, so every push also runs the full test suite.
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.8"

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen pre-commit run --all-files

      - name: Smoke run
        run: make smoke QUIET=1
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Keep the logs and smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-run
          path: |
            logs/
            results/smoke/
          if-no-files-found: ignore
