# data.ny.gov refuses requests from some networks (see DATA_SOURCES.md). This
# manual workflow runs the same download code on a GitHub-hosted runner, from
# the official URL, and returns the file with its manifest row as a short-lived
# artifact. Place the files in data/raw/ and provenance/ and run `make data`,
# which verifies the checksum.
name: fetch-nyserda

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.8"

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Download the NYSERDA panel from data.ny.gov
        run: uv run --frozen python -m cigd --quiet data --source nyserda_gasoline

      - name: Return the file and its manifest row
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nyserda-gasoline
          retention-days: 3
          path: |
            data/raw/nyserda_gasoline/
            provenance/manifest.csv
            logs/
